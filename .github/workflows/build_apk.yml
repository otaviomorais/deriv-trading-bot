name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform folders (android)
        run: flutter create . --platforms=android --project-name deriv_trading_bot --org com.derivbot

      - name: Patch AndroidManifest (permissions + foreground service)
        run: |
          python3 - <<'PYEOF'
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f).read()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>',
          ]
          inject = '\n    '.join(perms) + '\n    '
          if 'FOREGROUND_SERVICE_DATA_SYNC' not in s:
              s = s.replace('<application', inject + '<application', 1)
          svc = ('        <service\n'
                 '            android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n'
                 '            android:foregroundServiceType="dataSync"\n'
                 '            android:exported="false" />\n')
          if 'com.pravera.flutter_foreground_task.service.ForegroundService' not in s:
              idx = s.rfind('</application>')
              s = s[:idx] + svc + s[idx:]
          open(f, 'w').write(s)
          assert 'FOREGROUND_SERVICE_DATA_SYNC' in open(f).read(), 'patch failed'
          print('AndroidManifest patched OK')
          PYEOF

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  build:
    needs: analyze-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate platform folders (android)
        run: flutter create . --platforms=android --project-name deriv_trading_bot --org com.derivbot

      - name: Patch AndroidManifest (permissions + foreground service)
        run: |
          python3 - <<'PYEOF'
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f).read()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>',
          ]
          inject = '\n    '.join(perms) + '\n    '
          if 'FOREGROUND_SERVICE_DATA_SYNC' not in s:
              s = s.replace('<application', inject + '<application', 1)
          svc = ('        <service\n'
                 '            android:name="com.pravera.flutter_foreground_task.service.ForegroundService"\n'
                 '            android:foregroundServiceType="dataSync"\n'
                 '            android:exported="false" />\n')
          if 'com.pravera.flutter_foreground_task.service.ForegroundService' not in s:
              idx = s.rfind('</application>')
              s = s[:idx] + svc + s[idx:]
          open(f, 'w').write(s)
          assert 'FOREGROUND_SERVICE_DATA_SYNC' in open(f).read(), 'patch failed'
          print('AndroidManifest patched OK')
          PYEOF

      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deriv-trading-bot-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          TAG="v${VERSION}"
          FILE="deriv-trading-bot-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$FILE"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
            echo "Release $TAG atualizada com $FILE"
          else
            gh release create "$TAG" "$FILE" \
              --title "Deriv AI Bot $TAG" \
              --notes "APK release (Flutter $FLUTTER_VERSION).

              Baixe o arquivo .apk e instale no Android (permita apps de fontes desconhecidas).

              Requer token PAT + App ID da nova plataforma developers.deriv.com."
            echo "Release $TAG criada com $FILE"
          fi
